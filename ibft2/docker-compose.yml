services:
  node1:
    image: hyperledger/besu:24.3.0
    container_name: besu-ibft-node1
    hostname: node1
    cpus: "1.0"
    mem_limit: 2500M
    cap_add:
      - NET_ADMIN
    volumes:
      - ./node1/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    networks:
      besu_net:
        ipv4_address: 172.20.0.10
    ports:
      - "8545:8545"
    environment:
      - BESU_OPTS=-Xmx2g -Xms1g
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,WEB3,DEBUG,MINER
      - --rpc-http-cors-origins=*
      - --color-enabled=true
      - --host-allowlist=*
      - --p2p-enabled=true
      - --p2p-host=172.20.0.10
      - --p2p-port=30303
      - --network-id=1337
      - --data-storage-format=BONSAI
      - --rpc-http-max-active-connections=2000
      - --min-gas-price=1
      - --tx-pool-layer-max-capacity=25000
      - --miner-enabled
      - --miner-coinbase=0x1b2cf72b2959795ef0cbc45049b94df7c2801999
      - --sync-mode=FULL
      - --sync-min-peers=0
      - --static-nodes-file=/var/lib/besu/static-nodes.json

  node2:
    image: hyperledger/besu:24.3.0
    container_name: besu-ibft-node2
    hostname: node2
    cpus: "1.0"
    mem_limit: 2500M
    cap_add:
      - NET_ADMIN
    volumes:
      - ./node2/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    networks:
      besu_net:
        ipv4_address: 172.20.0.11
    environment:
      - BESU_OPTS=-Xmx2g -Xms1g
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,WEB3,DEBUG,MINER
      - --rpc-http-cors-origins=*
      - --color-enabled=true
      - --host-allowlist=*
      - --p2p-enabled=true
      - --p2p-host=172.20.0.11
      - --bootnodes=enode://6267b0935d85b85300fb0c852ecd4054173c4c5020a0df79eb6680eb57fdaff4cc9234265a607d4062e35f9e30ead73d28047766e6af1e997b59261a8d790b0d@172.20.0.10:30303
      - --network-id=1337
      - --data-storage-format=BONSAI
      - --rpc-http-max-active-connections=2000
      - --min-gas-price=1
      - --tx-pool-layer-max-capacity=25000
      - --miner-enabled
      - --miner-coinbase=0x1b2cf72b2959795ef0cbc45049b94df7c2801999
      - --sync-mode=FULL
      - --sync-min-peers=0
      - --static-nodes-file=/var/lib/besu/static-nodes.json

  node3:
    image: hyperledger/besu:24.3.0
    container_name: besu-ibft-node3
    hostname: node3
    cpus: "1.0"
    mem_limit: 2500M
    cap_add:
      - NET_ADMIN
    volumes:
      - ./node3/data:/var/lib/besu
      - ./genesis.json:/etc/besu/genesis.json
    networks:
      besu_net:
        ipv4_address: 172.20.0.12
    environment:
      - BESU_OPTS=-Xmx2g -Xms1g
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,IBFT,WEB3,DEBUG,MINER
      - --rpc-http-cors-origins=*
      - --color-enabled=true
      - --host-allowlist=*
      - --p2p-enabled=true
      - --p2p-host=172.20.0.12
      - --bootnodes=enode://6267b0935d85b85300fb0c852ecd4054173c4c5020a0df79eb6680eb57fdaff4cc9234265a607d4062e35f9e30ead73d28047766e6af1e997b59261a8d790b0d@172.20.0.10:30303
      - --network-id=1337
      - --data-storage-format=BONSAI
      - --bonsai-historical-block-limit=512
      - --rpc-http-max-active-connections=2000
      - --min-gas-price=1
      - --tx-pool-layer-max-capacity=25000
      - --miner-enabled
      - --miner-coinbase=0x1b2cf72b2959795ef0cbc45049b94df7c2801999
      - --sync-mode=CHECKPOINT
      - --sync-min-peers=0
      - --static-nodes-file=/var/lib/besu/static-nodes.json

networks:
  besu_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
