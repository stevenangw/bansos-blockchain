      - BESU_OPTS=-Xmx2g -Xms1g
    command:
      - --data-path=/var/lib/besu
      - --genesis-file=/etc/besu/genesis.json
      - --node-private-key-file=/var/lib/besu/key
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3,DEBUG,MINER
      - --rpc-http-cors-origins=*
      - --color-enabled=true
      - --host-allowlist=*
      - --p2p-enabled=true
      - --p2p-host=172.21.0.12
      - --bootnodes=enode://40214b745e7e9b21dc2bde16a703eddfa73d70acc1267268d7152ce3be2488be6176a91e0b601b79f8f41d44b5b982b401e8fa7ae1837f5739fea1fff7ccae6c@172.21.0.10:30303
      - --network-id=1337
      - --data-storage-format=BONSAI
      - --rpc-http-max-active-connections=2000
      - --min-gas-price=1
      - --tx-pool-layer-max-capacity=25000
      - --miner-enabled
      - --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      - --sync-mode=FULL
      - --sync-min-peers=0
      - --static-nodes-file=/var/lib/besu/static-nodes.json

networks:
  besu_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
